services:
  landing-page:
    image: ghcr.io/zery0x/landing-page:latest
    container_name: landing-page
    restart: unless-stopped
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.landing-page.rule=Host(`fies.dev`)"
      - "traefik.http.routers.landing-page.entrypoints=websecure"
      - "traefik.http.routers.landing-page.tls.certresolver=letsencrypt"
      - "traefik.http.services.landing-page.loadbalancer.server.port=3000"
      - "traefik.http.routers.landing-page.middlewares=crowdsec@docker"
      - "com.centurylinklabs.watchtower.enable=true"

networks:
  proxy:
    external: true
